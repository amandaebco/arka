services:
  db:
    image: apache/age:PG16_latest
    container_name: arka-db
    environment:
      POSTGRES_DB: arka_kg
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka
    ports:
      - "5432:5432"
    volumes:
      - arka-pgdata:/var/lib/postgresql/data
      - ./schemas/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka -d arka_kg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arka-pgdata:
