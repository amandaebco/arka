name: CI

# Tes yang tidak berjalan otomatis adalah tes yang perlahan berhenti dipercaya.
# Seluruh suite berjalan tanpa jaringan, tanpa database, dan tanpa model — itu
# keputusan rancangan sejak awal, dan alasannya terbayar di sini: tidak ada
# kredensial apa pun yang perlu diberikan ke CI.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        # `--extra dev` wajib: ruff dan pytest hidup di extra `dev`, dan
        # `uv sync` tanpa itu memasang dependensi runtime saja. Hasilnya langkah
        # Lint gagal bukan karena kodenya kotor, melainkan karena linternya tidak
        # ada -- kegagalan yang menuduh orang yang salah.
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Test
        # `-rA` mencetak ringkasan tiap tes yang gagal langsung di log Actions.
        # Tanpa itu langkah ini hanya melaporkan "exit code 1", dan kegagalan
        # yang tidak bisa direproduksi di laptop jadi mustahil dikejar.
        run: uv run pytest -q -rA --tb=short
