name: CI

# Tes yang tidak berjalan otomatis adalah tes yang perlahan berhenti dipercaya.
# Seluruh suite berjalan tanpa jaringan, tanpa database, dan tanpa model — itu
# keputusan rancangan sejak awal, dan alasannya terbayar di sini: tidak ada
# kredensial apa pun yang perlu diberikan ke CI.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Test
        run: uv run pytest -q
