id: executive_business_case
name: Executive Business Case
category: style
description: >
  Paparan strategis untuk VP Reliability. Temuan aset menjadi pemicu, lalu naik
  ke implikasi portfolio. Satu-satunya style yang menuntut kartu pertanyaan
  assurance begitu datanya ada — karena di sinilah ROI, RoNA, dan OEE dituntut,
  dan justru di sini angka karangan paling berbahaya.

