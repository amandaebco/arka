id: corporate_blue
name: Corporate Blue
category: color_system
description: >
  Palet default. Navy dan biru korporat di atas latar putih. Warna semantik
  membawa status dan angka kritis; navy membawa struktur — header kartu berlatar
  penuh, band seksi, dan pita identitas — sehingga halaman terbaca sebagai
  kelompok, bukan deretan kotak putih seragam.

metadata:
  version: 2
  tags: [default, neutral, print-safe]

primary:
  base: "#0F2C4C"
  on_base: "#FFFFFF"
  usage: "titles, filled card headers, section bands, dividing rules"

secondary:
  base: "#2E6DB4"
  on_base: "#FFFFFF"
  usage: "icons, card accents, chart elements"

severity:
  low: "#1E8E5A"
  medium: "#C8871B"
  high: "#D1553B"
  critical: "#9B2C2C"
  neutral: "#6B7280"

background:
  page: "#FFFFFF"
  card: "#FFFFFF"
  card_alt: "#F5F7FA"
  border: "#E2E8F0"
  card_header: "#0F2C4C"       # navy penuh di balik judul kartu
  on_card_header: "#FFFFFF"
  band_tint: "#EEF3F9"         # pengelompokan lembut, di bawah ambang kontras teks

accessibility:
  min_contrast_body: 4.5
  min_contrast_large_text: 3.0
  colour_blind_safe: true
  rules:
    - Colour is never the only difference; always pair it with a text label.
    - Red and green never sit adjacent without a label or shape to tell them apart.
    - Semantic accents are reserved for status and critical figures, never decoration.
    - >-
      Structural colour is not decoration: a filled header tells the reader where
      one card ends and the next begins, and it carries no value of its own.
