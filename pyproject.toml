[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arka"
version = "0.1.0"
description = "ARKA — Asset Reliability Knowledge Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent
    "google-adk>=1.0",
    "google-genai>=1.0,<2.0",
    # Data & graph
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pgvector>=0.3",
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    # Reporting
    "jinja2>=3.1,<4.0",
    "python-pptx>=1.0",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
