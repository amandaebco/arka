[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arka"
version = "0.1.0"
description = "ARKA — Asset Reliability Knowledge Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent
    "google-adk>=1.0",
    "google-genai>=1.0,<2.0",
    # Data & graph
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pgvector>=0.3",
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    # Reporting
    "jinja2>=3.1,<4.0",
    "python-pptx>=1.0",
    "playwright>=1.49",
    "python-docx>=1.1",
    "svglib>=1.5",
    "reportlab>=4.0",
    "openai>=2.53.0",
    "google-cloud-storage>=3.13.0",
    # Dipakai lapisan retrieval dan backend BigQuery. Sebelumnya hanya hadir
    # secara transitif lewat aiplatform, sehingga ada di venv tetapi tidak di
    # image — dan baru ketahuan setelah deploy.
    "google-cloud-bigquery>=3.30",
    "litellm>=1.96.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]
deploy = [
    "google-cloud-aiplatform[adk,agent-engines]>=1.95",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]


[tool.ruff]
line-length = 100
target-version = "py312"
# Berkas revisi Alembic ditulis oleh generatornya, bukan oleh tangan. Merapikannya
# membuat revisi berbeda dari yang dihasilkan `alembic revision`, dan perbedaan itu
# menyulitkan penelusuran riwayat skema.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Skrip demo dan uji coba menyimpan data sintetis serta prompt panjang sebagai
# literal utuh. Melipatnya hanya untuk memuaskan pengukur baris justru menyulitkan
# pembacaan datanya, dan pada literal prompt berisiko mengubah teks yang dikirim.
# Yang dibebaskan hanya panjang baris; aturan lain tetap berlaku di sini.
[tool.ruff.lint.per-file-ignores]
"scripts/demo_full_comprehensive_dashboard.py" = ["E501"]
"scripts/uji_variasi_layout.py" = ["E501"]
"scripts/uji_dashboard_prompts.py" = ["E501"]
"scripts/uji_golden_prompts.py" = ["E501"]
